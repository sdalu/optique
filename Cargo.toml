[package]
name = "optique"
version = "0.5.0"
edition = "2024"
description = "Fast FreeBSD ports options configurator for poudriere, synth and local builds"
license = "BSD-2-Clause"

# A pared-down policy, not clippy's pedantic group: each lint here is one the
# tree is clean of and whose fix reads better.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
redundant_closure_for_method_calls = "warn"

[dependencies]
anyhow = "1"
ratatui = "0.29"
clap = { version = "4", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
